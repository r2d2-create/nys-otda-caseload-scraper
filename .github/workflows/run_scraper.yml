name: Run OTDA Caseload Scraper

on:
  workflow_dispatch: # Allows manual trigger via the UI

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    
    # Force explicit top-level write authorization clearance
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Tools & Dependencies
      run: |
        pip install playwright pypdf
        playwright install chromium

    - name: Run Scraper Script
      run: python scrape_otda.py

    - name: Automatically Save and Push JSON Files
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update clean caseload JSON data tables"
        file_pattern: "*.json"
