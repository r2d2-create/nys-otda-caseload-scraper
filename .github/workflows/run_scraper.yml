name: Run OTDA Caseload Scraper

on:
  workflow_dispatch: # Allows you to manually trigger it with a single click

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gives the server permission to save JSON back to your repo
      
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Tools & Dependencies
      run: |
        pip install playwright pypdf
        playwright install chromium

    - name: Run Scraper Script
      run: python scrape_otda.py

    - name: Save Clean JSON Files to GitHub Repository
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add *.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update clean caseload JSON data tables" && git push)
