name: Run OTDA Caseload Scraper

on:
  workflow_dispatch: # Keeps the manual "Run workflow" click button active
  schedule:
    # This CRON layout forces GitHub to run this scraper completely automatically
    # at midnight every single Sunday morning (UTC), entirely hands-free.
    - cron: '0 0 * * 0'

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Tools & Dependencies
      run: |
        pip install playwright pypdf
        playwright install chromium

    - name: Run Scraper Script
      run: python scrape_otda.py

    - name: Automatically Save and Push JSON Files
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated schedule: Caseload master database update"
        file_pattern: "otda_master_database.json"
