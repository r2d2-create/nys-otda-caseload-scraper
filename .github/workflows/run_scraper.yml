name: Run OTDA Caseload Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *"

permissions:
  contents: read

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf requests beautifulsoup4

      - name: Run OTDA scraper
        run: python scrape_otda.py

      - name: Upload OTDA workflow files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otda-caseload-output
          path: |
            otda_master_database.json
            otda_pdf_metadata.json
            otda_archive_response.html
          if-no-files-found: warn
