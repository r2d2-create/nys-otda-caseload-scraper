name: Run OTDA Caseload Scraper

on:
  workflow_dispatch: # Allows manual trigger via the UI

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    
    # Force explicit top-level authorization permissions
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        ref: main # Locks the tracking state directly onto your main branch

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Tools & Dependencies
      run: |
        pip install playwright pypdf
        playwright install chromium

    - name: Run Scraper Script
      run: python scrape_otda.py

    - name: Save Clean JSON Files to GitHub Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add *.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update clean caseload JSON data tables" && git push origin main)
