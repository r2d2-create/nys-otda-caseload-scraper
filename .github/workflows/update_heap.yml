name: Download and parse OTDA HEAP PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otda-heap-local-update
  cancel-in-progress: false

jobs:
  update-heap:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          whoami
          python3 --version

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Download direct OTDA PDFs and parse HEAP pages
        run: |
          python3 scripts/update_heap.py

      - name: Commit PDFs and JSON data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add raw_pdfs/ data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update OTDA HEAP PDFs and data"
            git push
          fi
