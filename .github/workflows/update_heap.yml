name: Parse local OTDA HEAP PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otda-heap-parse
  cancel-in-progress: false

jobs:
  parse-local-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Parse local HEAP PDFs into JSON
        run: |
          python scripts/update_heap.py

      - name: Commit updated JSON if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Parse local OTDA HEAP PDFs"
            git push
          fi
