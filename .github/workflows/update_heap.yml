name: Download and parse OTDA HEAP PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otda-heap-local-update
  cancel-in-progress: false

jobs:
  update-heap:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          whoami
          python3 --version
          python3 -m pip --version

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Download direct OTDA PDFs and parse HEAP pages
        run: |
          python3 scripts/update_heap.py

      - name: Commit JSON data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # IMPORTANT:
          # Do NOT add raw_pdfs/. Source PDFs stay only on this Mac.
          # Commit only the small parsed JSON output files.
          git add data/

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Update OTDA HEAP data"
            git push origin main
          fi
