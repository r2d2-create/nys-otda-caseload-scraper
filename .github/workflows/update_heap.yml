name: Test self-hosted runner

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Show machine and paths
        run: |
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          whoami
          pwd
          ls -la

      - name: Create a test file in workspace
        run: |
          echo "Self-hosted runner works" > runner_test.txt
          ls -la runner_test.txt
