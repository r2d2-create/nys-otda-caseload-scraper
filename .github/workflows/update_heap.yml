name: Update OTDA HEAP data

on:
  # Lets you run the workflow manually from the GitHub Actions tab.
  workflow_dispatch:

  # Checks once each Monday at 15:20 UTC.
  # GitHub Actions schedules use UTC.

# Required because this workflow commits changed JSON files
# back into the same repository.
permissions:
  contents: write

# Prevent two update jobs from running at the same time.
concurrency:
  group: otda-heap-update
  cancel-in-progress: false

jobs:
  update-heap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate direct PDF URLs and update HEAP JSON
        run: |
          python scripts/update_heap.py

      - name: Commit updated data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update OTDA HEAP data"
            git push
          fi
